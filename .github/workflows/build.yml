name: Build Ignition Edge Container (amd64)

# x86-64 ONLY workflow — fast path, no QEMU. Pushes ALL canonical tags
# (:main, :latest, :${IGNITION_VERSION}) so amd64 consumers (UT3 cp02)
# can pull immediately without waiting on the arm64 build.
#
# arm64 builds in a SEPARATE workflow (build-arm64.yml). It publishes
# only the explicit :${VERSION}-arm64 tag — Pi nodes pull that one by
# name, so they're decoupled from the amd64 fast path.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Containerfile'
      - 'modules/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Containerfile'
      - 'modules/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      ignition_version:
        description: 'Ignition Edge version (zip release tag without leading v)'
        required: true
        default: '8.3.8'

concurrency:
  group: ignition-build-amd64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: embernet-ai/ignition-edge
      IGNITION_VERSION: ${{ github.event.inputs.ignition_version || '8.3.8' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman jq

      - name: Login to ghcr.io
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin

      - name: Build amd64 image
        run: |
          podman build \
            --platform linux/amd64 \
            --build-arg IGNITION_VERSION="${IGNITION_VERSION}" \
            -t "${REGISTRY}/${IMAGE_NAME}:build" \
            -f Containerfile .

      - name: Inspect image size
        run: |
          podman images "${REGISTRY}/${IMAGE_NAME}:build" \
            --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}'

      - name: Smoke test (verify install layout + ignition user)
        run: |
          podman run --rm \
            --platform linux/amd64 \
            --entrypoint /bin/sh \
            "${REGISTRY}/${IMAGE_NAME}:build" \
            -c 'set -e; \
                id ignition; \
                test -x /usr/local/bin/ignition/ignition.sh; \
                test -x /usr/local/bin/ignition/ignition-util.sh; \
                test -x /usr/local/bin/ignition/ignition-gateway; \
                test -f /usr/local/bin/ignition/data/gateway.xml_clean; \
                test -d /usr/local/bin/ignition/user-lib/modules; \
                echo "ignition layout OK (amd64)"'

      - name: Tag + push canonical tags (:main, :latest, :version, :version-amd64)
        if: github.event_name != 'pull_request'
        run: |
          for TAG in main latest "${IGNITION_VERSION}" "${IGNITION_VERSION}-amd64" main-amd64; do
            REF="${REGISTRY}/${IMAGE_NAME}:${TAG}"
            podman tag "${REGISTRY}/${IMAGE_NAME}:build" "${REF}"
            podman push "${REF}" "docker://${REF}"
            echo "Pushed: ${REF}"
          done

      - name: Summary
        run: |
          echo "amd64 build complete. Tags published: :main :latest :${IGNITION_VERSION} :${IGNITION_VERSION}-amd64 :main-amd64"
