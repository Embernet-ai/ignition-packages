name: Build Ignition Standard Container (amd64 + arm64)

# The full edition, ghcr.io/embernet-ai/ignition, from the installers on our
# v8.3.8 release: the x86-64 .run for amd64 and the aarch64 ZIP for arm64. See
# Containerfile.standard for why one file takes both.
#
# Each arch builds NATIVELY. arm64 runs on GitHub's arm64 runner instead of
# QEMU, because the Edge arm64 build under QEMU takes 80 minutes and this tree
# is bigger. Both are free here because this repo is public.
#
# Every build, PRs included, boots the gateway as uid 999 and waits for it to
# say RUNNING on 8.3.8. A layout check alone passed images that died on start
# (RUN_AS_USER, the CMD that ate container args), so this one has to start.
#
# On main the per-arch images go up as :<version>-amd64 / :<version>-arm64 and
# the manifest job joins them under :<version>, :latest and :main, the same
# shape edge-manifest.yml gives ignition-edge. Nothing ever deletes a digest.

on:
  push:
    branches: [ main ]
    paths:
      - 'Containerfile.standard'
      - 'entrypoint.sh'
      - '.github/workflows/build-standard.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Containerfile.standard'
      - 'entrypoint.sh'
      - '.github/workflows/build-standard.yml'
  workflow_dispatch:
    inputs:
      ignition_version:
        description: 'Ignition version (release tag without the leading v)'
        required: true
        default: '8.3.8'

concurrency:
  group: ignition-standard-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: embernet-ai/ignition
  IGNITION_VERSION: ${{ github.event.inputs.ignition_version || '8.3.8' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The .run is about 2 GB and the installed tree about 3 GB more.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman jq

      - name: Build ${{ matrix.arch }} image
        run: |
          podman build \
            --platform "linux/${{ matrix.arch }}" \
            --build-arg IGNITION_VERSION="${IGNITION_VERSION}" \
            -t "localhost/ignition:build" \
            -f Containerfile.standard .
          podman images localhost/ignition:build --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}'

      - name: Prove the image is the arch it says
        run: |
          GOT=$(podman image inspect localhost/ignition:build --format '{{.Architecture}}')
          echo "image architecture: $GOT"
          [ "$GOT" = "${{ matrix.arch }}" ] || { echo "::error::built $GOT, wanted ${{ matrix.arch }}"; exit 1; }

      - name: Layout check
        run: |
          podman run --rm --entrypoint /bin/sh localhost/ignition:build -c 'set -e
            test "$(id -u)" = 999
            test -x /usr/local/bin/ignition/ignition.sh
            test -x /usr/local/bin/ignition/ignition-util.sh
            test -x /usr/local/bin/ignition/ignition-gateway
            test -x /usr/local/bin/ignition/gwcmd.sh
            test -f /usr/local/bin/ignition/data/gateway.xml_clean
            test -w /usr/local/bin/ignition/data
            test -d /usr/local/bin/ignition/user-lib/modules
            echo "modules: $(ls /usr/local/bin/ignition/user-lib/modules | wc -l)"
            ls /usr/local/bin/ignition/user-lib/modules
            echo "layout OK as uid $(id -u)"'

      # Boots the gateway the way the chart does (non-root, EULA accepted, admin
      # pair from env) and waits for RUNNING. Commissioning that stalls waiting
      # for a browser shows up here as a timeout instead of on a customer's node.
      - name: Boot the gateway and wait for RUNNING
        run: |
          podman run -d --name ig -p 8088:8088 \
            -e ACCEPT_IGNITION_EULA=Y \
            -e GATEWAY_ADMIN_USERNAME=ci \
            -e GATEWAY_ADMIN_PASSWORD=ci-boot-check \
            -e IGNITION_EDITION=standard \
            localhost/ignition:build
          for i in $(seq 1 90); do
            S=$(curl -fsS --max-time 5 http://127.0.0.1:8088/StatusPing 2>/dev/null || true)
            echo "[$((i*10))s] ${S:-no answer}"
            case "$S" in *RUNNING*) break ;; esac
            if [ "$(podman inspect -f '{{.State.Running}}' ig)" != true ]; then
              echo "::error::the container exited"; podman logs ig | tail -80; exit 1
            fi
            sleep 10
          done
          case "$S" in *RUNNING*) ;; *) echo "::error::gateway never reached RUNNING"; podman logs ig | tail -120; exit 1 ;; esac
          INFO=$(curl -fsS --max-time 10 http://127.0.0.1:8088/system/gwinfo)
          echo "gwinfo: $INFO"
          echo "$INFO" | grep -q "Version=${IGNITION_VERSION}" || { echo "::error::gateway is not ${IGNITION_VERSION}"; exit 1; }
          echo "process owner: $(podman top ig user,args | grep -m1 -i java || true)"
          podman rm -f ig

      - name: Login to ghcr.io
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin

      - name: Push :${{ env.IGNITION_VERSION }}-${{ matrix.arch }}
        id: push
        if: github.event_name != 'pull_request'
        run: |
          for TAG in "${IGNITION_VERSION}-${{ matrix.arch }}" "main-${{ matrix.arch }}"; do
            REF="${REGISTRY}/${IMAGE_NAME}:${TAG}"
            podman tag localhost/ignition:build "${REF}"
            podman push "${REF}" "docker://${REF}"
            echo "Pushed: ${REF}"
          done
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  manifest:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    env:
      IMAGE: ghcr.io/embernet-ai/ignition

    steps:
      - name: Login to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # A list built on a mislabeled image is worse than no list.
      - name: Resolve per-arch digests
        id: arch
        run: |
          set -euo pipefail
          for ARCH in amd64 arm64; do
            REF="${IMAGE}:${IGNITION_VERSION}-${ARCH}"
            DIGEST=$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' | jq -r .digest)
            GOT=$(docker buildx imagetools inspect "$REF" --format '{{json .Image}}' | jq -r .architecture)
            if [ "$GOT" != "$ARCH" ]; then
              echo "::error::$REF is $GOT, not $ARCH"
              exit 1
            fi
            echo "$REF -> $DIGEST ($GOT)"
            echo "${ARCH}=${DIGEST}" >> "$GITHUB_OUTPUT"
          done

      - name: Point the canonical tags at a two-arch list
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE}:${IGNITION_VERSION}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:main" \
            "${IMAGE}@${{ steps.arch.outputs.amd64 }}" \
            "${IMAGE}@${{ steps.arch.outputs.arm64 }}"

      - name: Verify every canonical tag resolves per platform
        run: |
          set -euo pipefail
          for TAG in "${IGNITION_VERSION}" latest main; do
            RAW=$(docker buildx imagetools inspect --raw "${IMAGE}:${TAG}")
            for ARCH in amd64 arm64; do
              WANT="${{ steps.arch.outputs.amd64 }}"
              [ "$ARCH" = arm64 ] && WANT="${{ steps.arch.outputs.arm64 }}"
              GOT=$(echo "$RAW" | jq -r --arg a "$ARCH" '.manifests[] | select(.platform.os=="linux" and .platform.architecture==$a) | .digest')
              if [ "$GOT" != "$WANT" ]; then
                echo "::error::${IMAGE}:${TAG} linux/${ARCH} is '${GOT}', expected ${WANT}"
                exit 1
              fi
              echo "${IMAGE}:${TAG} linux/${ARCH} -> ${GOT}"
            done
          done
